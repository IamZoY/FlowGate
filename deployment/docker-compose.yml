# FlowGate production deployment
# Config, certs, and .env are managed by deploy.sh

services:
  flowgate:
    image: flowgate:dev
    restart: unless-stopped
    ports:
      - "${FLOWGATE_PORT:-443}:8443"
    volumes:
      - ./config.yaml:/etc/flowgate/config.yaml:ro
      - ./certs:/certs:ro
      - flowgate-data:/data
    environment:
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: ["--config", "/etc/flowgate/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-qO-", "https://localhost:8443/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - flowgate-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  flowgate-data:

networks:
  flowgate-net:
    driver: bridge
