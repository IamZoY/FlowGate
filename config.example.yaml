server:
  host: "0.0.0.0"
  port: 8080
  # tls_cert: ""   # path to TLS certificate (enables HTTPS when set with tls_key)
  # tls_key: ""    # path to TLS private key
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "120s"

database:
  path: "./flowgate.db"
  max_open_connections: 5
  max_idle_connections: 2

transfer:
  worker_pool_size: 10
  queue_capacity: 1000
  # retry_attempts: 0    # default 0 (disabled). Set >0 to enable retries.
  # retry_backoff: "0s"  # base backoff between retries (exponential with jitter)

logging:
  level: "info"
  format: "json"

security:
  secret_key: "${SECRET_KEY}"

dashboard:
  enabled: true
  auth_enabled: false
  username: "admin"
  password: "${DASH_PASSWORD}"
